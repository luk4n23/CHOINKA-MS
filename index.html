function plotno(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function grad(stops,w,h,prom){
  const c=plotno(w,h),g=c.getContext('2d');
  const gr=prom?g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2):g.createLinearGradient(0,0,0,h);
  stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,w,h);
  return new THREE.CanvasTexture(c);
}
function brokat(){
  const c=plotno(512,512),g=c.getContext('2d');
  g.fillStyle='#17171a';g.fillRect(0,0,512,512);
  for(let i=0;i<1300;i++){
    const x=Math.random()*512,y=Math.random()*512,r=.5+Math.random()*1.8,a=.25+Math.random()*.75;
    const t=Math.random();
    const col=t<.6?'255,255,255':(t<.87?'205,216,228':'255,232,188');
    g.beginPath();g.arc(x,y,r,0,7);g.fillStyle='rgba('+col+','+a+')';g.fill();

}
